<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Console — Timetable</title>
  <link rel="stylesheet" href="admin.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
</head>

<body>
  <div class="main-wrapper">
    <article class="admin-card">
      <section class="admin-hero">
        <div class="status-pill hidden" id="admin-status-badge">
          <span></span>
        </div>
        <h1 class="admin-headline">Admin Login</h1>
        <p class="admin-subtitle">
          Secure access for timetable configuration.
        </p>
      </section>

      <div class="admin-content">
        <section class="login-card" id="admin-login-card">
          <form id="admin-login-form">
            <div class="form-group">
              <label for="admin-password-input">Admin Password</label>
              <input id="admin-password-input" type="password" placeholder="Enter password" autocomplete="off" />
            </div>
            <div class="form-actions">
              <button class="btn-primary" type="submit">Login</button>
            </div>
            <p class="alert-text" id="admin-login-error"></p>
          </form>
        </section>

        <section class="dashboard-card hidden" id="admin-dashboard">
          <div class="github-config-card" id="github-config-card">
            <h3 class="card-title">GitHub Connection</h3>
            <p class="admin-subtitle" style="margin-top:-6px;">
              Needed to publish announcements to the shared <code>announcements.json</code> file.
              The token is kept only in this browser tab's session storage — it is never saved to the repo.
            </p>
            <div class="form-group">
              <label for="github-owner-input">Repo Owner</label>
              <input id="github-owner-input" type="text" placeholder="e.g. Chenitha-Vindiya" />
            </div>
            <div class="form-group">
              <label for="github-repo-input">Repo Name</label>
              <input id="github-repo-input" type="text" placeholder="e.g. timetable-app" />
            </div>
            <div class="form-group">
              <label for="github-branch-input">Branch (the one GitHub Pages deploys from)</label>
              <input id="github-branch-input" type="text" placeholder="e.g. main" />
            </div>
            <div class="form-group">
              <label for="github-token-input">GitHub Personal Access Token</label>
              <input id="github-token-input" type="password" placeholder="fine-grained token with Contents: Read & write" autocomplete="off" />
            </div>
            <div class="form-actions">
              <button class="btn-secondary" type="button" id="github-save-config-btn">Save connection for this session</button>
            </div>
            <p class="alert-text" id="github-config-status"></p>
          </div>
          <div class="form-actions dashboard-toolbar">
            <button class="btn-primary" type="button" id="create-announcement-btn">
              Create Announcement
            </button>
            <button class="btn-secondary" type="button" id="admin-logout-btn">
              Logout
            </button>
          </div>

          <div class="announcement-list hidden" id="announcement-list">
            <h3 class="card-title">Announcements</h3>
            <div class="announcement-items"></div>
          </div>
        </section>

        <div class="modal-overlay hidden" id="announcement-modal">
          <div class="modal-card announcement-modal-card">
            <button class="modal-close" id="announcement-modal-close" type="button">×</button>
            <h3 class="card-title">Create Announcement</h3>
            <div class="form-group">
              <label for="announcement-faculty">Faculty</label>
              <select id="announcement-faculty"></select>
            </div>
            <div class="form-group">
              <label for="announcement-year">Year</label>
              <select id="announcement-year"></select>
            </div>
            <div class="form-group">
              <label for="announcement-semester">Semester</label>
              <select id="announcement-semester"></select>
            </div>
            <div class="form-group">
              <label for="announcement-spec">Specialization</label>
              <select id="announcement-spec"></select>
            </div>
            <div class="form-group">
              <label for="announcement-group">Group</label>
              <select id="announcement-group"></select>
            </div>
            <div class="form-group">
              <label for="announcement-title">Announcement Title</label>
              <input id="announcement-title" type="text" placeholder="Enter announcement title" />
            </div>
            <div class="form-group">
              <label for="announcement-text">Announcement Text</label>
              <textarea id="announcement-text" rows="4" placeholder="Type announcement here..."></textarea>
            </div>
            <div class="form-actions">
              <button class="btn-primary" type="button" id="publish-announcement-btn">
                Send Announcement
              </button>
              <button class="btn-secondary" type="button" id="announcement-modal-cancel">
                Cancel
              </button>
            </div>
            <p class="alert-text" id="announcement-error"></p>
          </div>
        </div>
      </div>
    </article>
  </div>

  <script src="admin.js" defer></script>
</body>

</html>
